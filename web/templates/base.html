<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inventory Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .metric-card {
            border-left: 4px solid #007bff;
        }
        .metric-card.low-stock {
            border-left-color: #dc3545;
        }
        .metric-card.out-of-stock {
            border-left-color: #6c757d;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .table-responsive {
            border-radius: 0.375rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .status-badge {
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar px-0">
                <div class="position-sticky pt-3">
                    <div class="px-3 mb-3">
                        <h5 class="text-primary">
                            <i class="bi bi-box-seam"></i> Inventory Manager
                        </h5>
                    </div>
                    <nav class="nav flex-column">
                        <a class="nav-link {{ 'active' if request.endpoint == 'dashboard' else '' }}" href="{{ url_for('dashboard') }}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                        <a class="nav-link {{ 'active' if request.endpoint == 'inventory' else '' }}" href="{{ url_for('inventory') }}">
                            <i class="bi bi-grid-3x3-gap"></i> Inventory
                        </a>
                        <a class="nav-link {{ 'active' if request.endpoint == 'low_stock' else '' }}" href="{{ url_for('low_stock') }}">
                            <i class="bi bi-exclamation-triangle"></i> Low Stock
                        </a>
                        <hr class="my-3">
                        <a class="nav-link" href="#" onclick="syncInventory()">
                            <i class="bi bi-arrow-repeat"></i> Sync Now
                        </a>
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#uploadModal">
                            <i class="bi bi-upload"></i> Upload CSV
                        </a>
                    </nav>
                </div>
            </div>
            
            <!-- Main content -->
            <div class="col-md-10">
                <div class="py-3">
                    <!-- Header -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2>{% block header %}Dashboard{% endblock %}</h2>
                        <div>
                            <span class="text-muted">Last sync: {{ last_sync or 'Never' }}</span>
                            <button class="btn btn-outline-primary btn-sm ms-2" onclick="syncInventory()">
                                <i class="bi bi-arrow-repeat"></i> Sync
                            </button>
                        </div>
                    </div>
                    
                    <!-- Alerts -->
                    <div id="alerts"></div>
                    
                    <!-- Main content area -->
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
    
    <!-- Upload Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="uploadModalLabel">Upload CSV File</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="csvFile" class="form-label">Choose CSV file</label>
                            <input type="file" class="form-control" id="csvFile" name="file" accept=".csv" required>
                            <div class="form-text">
                                Upload product inventory or sales data in CSV format.
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="uploadCSV()">Upload</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Show alert function
        function showAlert(message, type = 'info') {
            const alertsContainer = document.getElementById('alerts');
            const alertId = 'alert-' + Date.now();
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert" id="${alertId}">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            alertsContainer.innerHTML = alertHtml;
            
            // Auto-dismiss after 5 seconds
            setTimeout(() => {
                const alertElement = document.getElementById(alertId);
                if (alertElement) {
                    const alert = new bootstrap.Alert(alertElement);
                    alert.close();
                }
            }, 5000);
        }
        
        // Sync inventory function
        function syncInventory() {
            showAlert('Starting inventory sync...', 'info');
            
            fetch('/sync', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showAlert('Inventory sync completed successfully!', 'success');
                    // Reload page after short delay
                    setTimeout(() => window.location.reload(), 2000);
                } else {
                    showAlert('Sync failed: ' + data.message, 'danger');
                }
            })
            .catch(error => {
                showAlert('Sync error: ' + error.message, 'danger');
            });
        }
        
        // Upload CSV function
        function uploadCSV() {
            const fileInput = document.getElementById('csvFile');
            const file = fileInput.files[0];
            
            if (!file) {
                showAlert('Please select a file to upload.', 'warning');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            showAlert('Uploading file...', 'info');
            
            fetch('/ingest-csv', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showAlert('File uploaded and processed successfully!', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('uploadModal')).hide();
                    fileInput.value = '';
                    // Reload page after short delay
                    setTimeout(() => window.location.reload(), 2000);
                } else {
                    showAlert('Upload failed: ' + data.message, 'danger');
                }
            })
            .catch(error => {
                showAlert('Upload error: ' + error.message, 'danger');
            });
        }
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
