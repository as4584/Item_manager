name: "CodeQL Security Analysis"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 2 AM UTC
    - cron: '0 2 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
        # CodeQL supports: 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
        # Extended security and quality queries
        queries: security-extended,security-and-quality
        # Custom queries (optional)
        # config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:${{ matrix.language }}"
        # Upload results to Security tab
        upload: true

    - name: Upload CodeQL results as artifact
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: codeql-results
        path: /home/runner/work/_temp/codeql_databases/
        retention-days: 30

  # Summary job for required checks
  codeql-success:
    name: CodeQL Success
    runs-on: ubuntu-latest
    needs: analyze
    if: always()
    steps:
    - name: Check CodeQL status
      run: |
        if [ "${{ needs.analyze.result }}" != "success" ]; then
          echo "❌ CodeQL analysis failed or was skipped"
          exit 1
        fi
        echo "✅ CodeQL analysis completed successfully"
